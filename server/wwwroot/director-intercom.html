<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Director Intercom</title>
</head>
<body style="background:#111; color:#eee; font-family:sans-serif; margin:10px;">
    <h3>Director Intercom Active</h3>
    <div id="audio-container"></div>

    <script>
        let ws = null;
        let directorStream = null;
        const peers = {}; // alias/cam -> RTCPeerConnection
        let isConnecting = false;
        let isConnected = false;
        let isMicMuted = false;

        const urlParams = new URLSearchParams(window.location.search);
        const rawRoomId = urlParams.get('roomId') || urlParams.get('roomName') || 'intercom';
        const roomId = rawRoomId.replace(/\s+/g, '');
        const pin = (urlParams.get('pin') || '').trim();
        const voiceServer = (urlParams.get('voiceServer') || '').trim();

        const ICE_SERVERS = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:vidikom.app:3478' },
            {
                urls: [
                    'turn:vidikom.app:3478?transport=udp',
                    'turn:vidikom.app:3478?transport=tcp'
                ],
                username: 'vidikom',
                credential: 'viicsoft'
            }
        ];

        window._audioSources = window._audioSources || {};

        function log(msg) {
            console.log('[Director Intercom] ' + msg);
            postToWpf('log:' + msg);
        }

        function postToWpf(msg) {
            try {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(msg);
                }
            } catch (e) {
                console.warn('postToWpf error:', e);
            }
        }

        function setMicMute(muted) {
            isMicMuted = !!muted;
            if (directorStream) {
                directorStream.getAudioTracks().forEach(track => {
                    track.enabled = !isMicMuted;
                });
            }
            postToWpf(isMicMuted ? 'mic_muted' : 'mic_live');
            log('Director microphone muted: ' + isMicMuted);
        }

        function toggleMicMute() {
            setMicMute(!isMicMuted);
        }

        window.setMicMute = setMicMute;
        window.toggleMicMute = toggleMicMute;

        function setHighBitrateOpus(sdp) {
            if (!sdp) return sdp;
            let lines = sdp.split('\r\n');
            let opusPayloadType = null;
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('a=rtpmap:') && lines[i].toLowerCase().includes('opus')) {
                    const match = lines[i].match(/a=rtpmap:(\d+)/);
                    if (match) opusPayloadType = match[1];
                }
            }
            if (opusPayloadType) {
                let fmtpFound = false;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith(`a=fmtp:${opusPayloadType}`)) {
                        fmtpFound = true;
                        if (lines[i].includes('maxaveragebitrate')) {
                            lines[i] = lines[i].replace(/maxaveragebitrate=\d+/, 'maxaveragebitrate=128000');
                        } else {
                            lines[i] += ';maxaveragebitrate=128000;stereo=1';
                        }
                    }
                }
                if (!fmtpFound) {
                    lines.push(`a=fmtp:${opusPayloadType} maxaveragebitrate=128000;stereo=1`);
                }
            }
            return lines.join('\r\n');
        }

        function initWebSocket() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;
            }

            let proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            let host = location.host || '127.0.0.1:8080';

            if (voiceServer) {
                const cleanVoice = voiceServer.replace(/^https?:\/\//i, '').replace(/^wss?:\/\//i, '').replace(/\/+$/, '');
                if (voiceServer.startsWith('ws://') || voiceServer.startsWith('http://')) {
                    proto = 'ws:';
                } else {
                    proto = 'wss:';
                }
                host = cleanVoice;
            }
            
            // Connect to voice mesh endpoint
            const targetUrl = `${proto}//${host}/ws/voice?roomId=${encodeURIComponent(roomId)}&pin=${encodeURIComponent(pin)}`;
            log('Connecting to signaling endpoint: ' + targetUrl);
            ws = new WebSocket(targetUrl);

            ws.onopen = () => {
                log('Signaling WebSocket connected to /ws/voice');
                // Join voice room as Director
                ws.send(JSON.stringify({
                    type: 'join',
                    roomId: roomId,
                    alias: 'Director',
                    role: 'director'
                }));

                // Also announce ready for legacy intercom
                ws.send(JSON.stringify({ type: 'intercom-director-ready' }));
            };

            ws.onmessage = async (e) => {
                try {
                    const msg = JSON.parse(e.data);
                    const type = msg.type;

                    // Mesh events (React Native WebRtcMeshService)
                    if (type === 'peers') {
                        log('Received peers list: ' + JSON.stringify(msg.peers));
                        if (Array.isArray(msg.peers)) {
                            for (const p of msg.peers) {
                                if (p.alias && p.alias !== 'Director') {
                                    await getOrCreatePeer(p.alias, true);
                                }
                            }
                        }
                    } else if (type === 'peer-joined') {
                        const alias = msg.alias || msg.peer?.alias;
                        log('Peer joined: ' + alias);
                        if (alias && alias !== 'Director') {
                            await getOrCreatePeer(alias, false);
                        }
                    } else if (type === 'peer-left') {
                        const alias = msg.alias || msg.peerId;
                        log('Peer left: ' + alias);
                        if (alias) cleanupPeer(alias);
                    } else if (type === 'signal') {
                        if (msg.from && (msg.to === 'Director' || !msg.to) && msg.data) {
                            await handleSignalData(msg.from, msg.data);
                        }
                    }
                    // Direct camera events
                    else if (type === 'intercom-offer') {
                        await handleDirectOffer(msg.cam, msg.sdp);
                    } else if (type === 'intercom-ice') {
                        await handleDirectIce(msg.cam, msg.candidate);
                    } else if (type === 'intercom-leave') {
                        cleanupPeer(msg.cam);
                    }
                } catch (err) {
                    log('Error handling WS message: ' + err.message);
                }
            };

            ws.onclose = () => {
            log('Signaling WebSocket closed.');
            ws = null;
            if (isConnected || isConnecting) {
                log('Attempting signaling reconnect in 2s...');
                setTimeout(() => {
                    if (isConnected || isConnecting) {
                        initWebSocket();
                    }
                }, 2000);
            }
        };

        ws.onerror = (err) => {
            log('WebSocket error: ' + err);
        };
    }

    function ensureMicTracksAttached(pc) {
        if (!directorStream) return;
        
        let audioSender = pc.getSenders().find(s => s.track && s.track.kind === 'audio');
        if (!audioSender) {
            directorStream.getAudioTracks().forEach(track => {
                track.enabled = !isMicMuted;
                try { 
                    pc.addTrack(track, directorStream); 
                    log('Attached microphone track via addTrack (enabled=' + track.enabled + ')');
                } catch (e) {
                    log('Error attaching microphone track: ' + e.message);
                }
            });
        }
    }

    async function connectIntercom() {
        if (isConnecting || isConnected) {
            log('connectIntercom called but already connecting/connected.');
            return;
        }
        isConnecting = true;
        log('Starting Director intercom...');

        try {
            // 1. Initialize WebAudio context
            try {
                if (!window._audioCtx) {
                    window._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (window._audioCtx.state === 'suspended') {
                    await window._audioCtx.resume();
                }
            } catch (_) {}

            // 2. Capture Director microphone
            log('Requesting microphone access...');
            try {
                directorStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });
            } catch (micErr1) {
                try {
                    directorStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                } catch (micErr2) {
                    log('Microphone warning: ' + micErr2.message + ' (continuing in listen mode)');
                }
            }

            if (directorStream) {
                directorStream.getAudioTracks().forEach(track => {
                    track.enabled = !isMicMuted;
                });
                log('Microphone acquired successfully with ' + directorStream.getAudioTracks().length + ' track(s)');
                Object.values(peers).forEach(pc => ensureMicTracksAttached(pc));
            }

            isConnected = true;
            isConnecting = false;

            // 3. Connect to WebSocket signaling NOW that mic is ready
            initWebSocket();

            postToWpf('intercom_connected');
        } catch (err) {
            log('Intercom connect error: ' + err.message);
            isConnecting = false;
            isConnected = false;
            postToWpf('intercom_error');
        }
    }
    window.connectIntercom = connectIntercom;

        async function getOrCreatePeer(alias, initiateOffer = false) {
            if (peers[alias]) {
                if (initiateOffer || peers[alias].connectionState === 'failed' || peers[alias].connectionState === 'closed') {
                    log(`Recreating peer connection for ${alias} (initiateOffer=${initiateOffer}, state=${peers[alias].connectionState})`);
                    cleanupPeer(alias);
                } else {
                    return peers[alias];
                }
            }

            log('Creating RTCPeerConnection for: ' + alias);
            const pc = new RTCPeerConnection({
                iceServers: ICE_SERVERS
            });

            peers[alias] = pc;
            
            pc._makingOffer = false;
            pc.onnegotiationneeded = async () => {
                log('Negotiation needed for: ' + alias);
                try {
                    pc._makingOffer = true;
                    const offer = await pc.createOffer();
                    if (pc.signalingState !== 'stable') return;
                    const modifiedSdp = setHighBitrateOpus(offer.sdp);
                    await pc.setLocalDescription({ type: offer.type, sdp: modifiedSdp });
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'signal',
                            roomId: roomId,
                            from: 'Director',
                            to: alias,
                            data: { type: pc.localDescription.type, sdp: pc.localDescription.sdp }
                        }));
                    }
                } catch (e) {
                    log('Negotiation error for ' + alias + ': ' + e.message);
                } finally {
                    pc._makingOffer = false;
                }
            };

            ensureMicTracksAttached(pc);

            pc.ontrack = (event) => {
                log(`Audio track received from: ${alias}`);
                let audioEl = document.getElementById('audio-peer-' + alias);
                if (!audioEl) {
                    audioEl = document.createElement('audio');
                    audioEl.id = 'audio-peer-' + alias;
                    audioEl.autoplay = true;
                    audioEl.controls = false;
                    audioEl.volume = 1.0;
                    audioEl.muted = false;
                    document.getElementById('audio-container').appendChild(audioEl);
                }
                const stream = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([event.track]);
                audioEl.srcObject = stream;
                audioEl.play().catch(e => log(`Autoplay notification for ${alias}: ` + e.message));

                try {
                    if (!window._audioCtx) {
                        window._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (window._audioCtx.state === 'suspended') {
                        window._audioCtx.resume();
                    }
                    const source = window._audioCtx.createMediaStreamSource(stream);
                    window._audioSources[alias] = source; // Keep alive against GC
                    source.connect(window._audioCtx.destination);
                    log(`Direct WebAudio mixer attached for ${alias}`);
                } catch (webaudioErr) {
                    log(`WebAudio attach error for ${alias}: ` + webaudioErr.message);
                }
            };

            pc.onicecandidate = (event) => {
                if (event.candidate && event.candidate.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'signal',
                        roomId: roomId,
                        from: 'Director',
                        to: alias,
                        data: {
                            type: 'candidate',
                            candidate: event.candidate
                        }
                    }));
                }
            };

            pc.onconnectionstatechange = () => {
                log(`${alias} connection state: ${pc.connectionState}`);
                if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                    cleanupPeer(alias);
                }
            };

            if (initiateOffer) {
                try {
                    pc._makingOffer = true;
                    const offer = await pc.createOffer();
                    const modifiedSdp = setHighBitrateOpus(offer.sdp);
                    await pc.setLocalDescription({ type: offer.type, sdp: modifiedSdp });
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'signal',
                            roomId: roomId,
                            from: 'Director',
                            to: alias,
                            data: { type: pc.localDescription.type, sdp: pc.localDescription.sdp }
                        }));
                    }
                } catch (e) {
                    log(`Error creating offer for ${alias}: ` + e.message);
                } finally {
                    pc._makingOffer = false;
                }
            }

            return pc;
        }

        async function handleSignalData(fromAlias, data) {
            const pc = await getOrCreatePeer(fromAlias, false);
            log(`[handleSignalData] fromAlias=${fromAlias}, pc=${pc}, state=${pc?.signalingState}`);
            if (!pc) return;

            if (data.type === 'offer') {
                log(`Handling offer from: ${fromAlias}`);
                const offerCollision = (data.type === 'offer') && (pc._makingOffer || pc.signalingState !== 'stable');
                pc._ignoreOffer = !true && offerCollision; // Director is always impolite because Camera is polite

                if (pc._ignoreOffer) {
                    log(`Offer collision detected for ${fromAlias}, ignoring remote offer`);
                    return;
                }

                if (offerCollision) {
                    log(`Offer collision detected for ${fromAlias}, rolling back local offer`);
                    try {
                        await pc.setLocalDescription({ type: 'rollback' });
                    } catch (e) {
                        log(`Rollback failed for ${fromAlias}: ` + e.message);
                    }
                }
                await pc.setRemoteDescription(new RTCSessionDescription(data));

                // Flush queued ICE candidates
                if (pc._iceQueue && pc._iceQueue.length > 0) {
                    for (const c of pc._iceQueue) {
                        try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (_) {}
                    }
                    pc._iceQueue = [];
                }

                // Ensure local mic track is added BEFORE answering so the answer establishes sendrecv audio!
                ensureMicTracksAttached(pc);

                const answer = await pc.createAnswer();
                const modifiedSdp = setHighBitrateOpus(answer.sdp);
                await pc.setLocalDescription({ type: answer.type, sdp: modifiedSdp });

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'signal',
                        roomId: roomId,
                        from: 'Director',
                        to: fromAlias,
                        data: { type: pc.localDescription.type, sdp: pc.localDescription.sdp }
                    }));
                }
            } else if (data.type === 'answer') {
                log(`Handling answer from: ${fromAlias}`);
                await pc.setRemoteDescription(new RTCSessionDescription(data));

                // Flush queued ICE candidates
                if (pc._iceQueue && pc._iceQueue.length > 0) {
                    for (const c of pc._iceQueue) {
                        try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (_) {}
                    }
                    pc._iceQueue = [];
                }
            } else if (data.type === 'candidate' || data.candidate) {
                const cand = data.candidate || data;
                if (!cand || !cand.candidate) return; // Skip empty candidate strings
                if (!pc.remoteDescription) {
                    if (!pc._iceQueue) pc._iceQueue = [];
                    pc._iceQueue.push(cand);
                } else {
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(cand));
                    } catch (e) {
                        log(`Error adding ICE candidate from ${fromAlias}: ` + e.message);
                    }
                }
            }
        }

        async function handleDirectOffer(cam, sdp) {
            const alias = 'Cam ' + cam;
            const pc = await getOrCreatePeer(alias, false);
            if (!pc) return;
            ensureMicTracksAttached(pc);
            await pc.setRemoteDescription(new RTCSessionDescription(sdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'intercom-answer',
                    cam: cam.toString(),
                    sdp: answer
                }));
            }
        }

        async function handleDirectIce(cam, candidate) {
            const alias = 'Cam ' + cam;
            const pc = await getOrCreatePeer(alias, false);
            if (pc && candidate && candidate.candidate) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {
                    log(`Error adding direct ICE for ${alias}: ` + e.message);
                }
            }
        }

        function cleanupPeer(alias) {
            const pc = peers[alias];
            if (pc) {
                try { pc.close(); } catch (e) {}
                delete peers[alias];
            }
            if (window._audioSources && window._audioSources[alias]) {
                try { window._audioSources[alias].disconnect(); } catch (_) {}
                delete window._audioSources[alias];
            }
            const el = document.getElementById('audio-peer-' + alias);
            if (el) el.remove();
            log(`Cleaned up peer: ${alias}`);
        }

        function disconnectIntercom() {
            log('Disconnecting Director intercom...');
            if (directorStream) {
                directorStream.getTracks().forEach(t => {
                    try { t.stop(); } catch (_) {}
                });
                directorStream = null;
                log('Microphone hardware released.');
            }

            if (ws) {
                try {
                    ws.onopen = null;
                    ws.onmessage = null;
                    ws.onerror = null;
                    ws.onclose = null;
                    ws.close();
                } catch (_) {}
                ws = null;
                log('Signaling WebSocket closed.');
            }

            Object.keys(peers).forEach(alias => cleanupPeer(alias));
            isConnected = false;
            isConnecting = false;

            if (window._audioCtx && window._audioCtx.state !== 'closed') {
                try { window._audioCtx.suspend(); } catch (_) {}
            }

            const container = document.getElementById('audio-container');
            if (container) container.innerHTML = '';

            postToWpf('intercom_disconnected');
            log('Director intercom disconnected.');
        }
        window.disconnectIntercom = disconnectIntercom;

        // WebAudio periodic keepalive
        setInterval(() => {
            if (isConnected && window._audioCtx && window._audioCtx.state === 'suspended') {
                window._audioCtx.resume();
            }
        }, 1500);

        window.addEventListener('DOMContentLoaded', () => {
            log('Director Intercom initialized in idle state. Microphone not accessed until Intercom is ON.');
        });
    </script>
</body>
</html>
